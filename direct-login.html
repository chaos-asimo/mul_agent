<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快速登录 - 多用户工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 40px;
    width: 420px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
  }
  h1 {
    color: #f1f5f9;
    font-size: 20px;
    margin-bottom: 8px;
  }
  .sub {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: #3b82f6;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #2563eb; }
  .btn:disabled { background: #475569; cursor: not-allowed; }
  .result {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .result.ok {
    display: block;
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.3);
    color: #34d399;
  }
  .result.err {
    display: block;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <h1>快速登录</h1>
  <p class="sub">输入用户名，自动创建/登录并跳转至工作台</p>

  <div id="loginView">
  <label>用户名</label>
  <input type="text" id="username" placeholder="例如: 3888" autocomplete="off">

  <label>显示名</label>
  <input type="text" id="displayName" placeholder="例如: 罗俊易" autocomplete="off">

  <label>Login Token</label>
  <input type="text" id="loginToken" placeholder="可选，留空则不需要" autocomplete="off">

  <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
// 目标地址：同源时自动取当前域名，file:// 打开时需手动填写
const BASE = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
  ? window.location.origin
  : "https://claw.jbysoft.com";

// 预填的用户信息（可在此修改）
const PRESET_USERNAME = "3888";
const PRESET_DISPLAY_NAME = "罗俊同学";
const PRESET_LOGIN_TOKEN = "test-token";
// 二次验证步骤暂存的用户名
let pendingUsername = "";

// 页面加载后自动填入并登录
document.addEventListener('DOMContentLoaded', function() {
  const usernameInput = document.getElementById('username');
  const displayNameInput = document.getElementById('displayName');
  const loginTokenInput = document.getElementById('loginToken');
  
  usernameInput.value = PRESET_USERNAME;
  displayNameInput.value = PRESET_DISPLAY_NAME;
  loginTokenInput.value = PRESET_LOGIN_TOKEN;
  
  // 延迟一点再提交，让表单先展示出来
  setTimeout(function() {
    doLogin();
  }, 300);
});

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const displayName = document.getElementById('displayName').value.trim();
  const loginToken = document.getElementById('loginToken').value.trim();
  const btn = document.getElementById('loginBtn');
  const result = document.getElementById('result');

  if (!username) {
    result.className = 'result err';
    result.textContent = '请输入用户名';
    return;
  }
  if (!displayName) {
    result.className = 'result err';
    result.textContent = '请输入显示名';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>登录中...';
  result.className = 'result';
  result.textContent = '';

  // 构建请求体
  const body = { username, display_name: displayName };
  if (loginToken) {
    body.login_token = loginToken;
  }

  try {
    const res = await fetch(BASE + '/api/lobster-mu/login/direct', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (data.status === 'success') {
      result.className = 'result ok';
      result.innerHTML = '登录成功！即将跳转...<br><small>用户: ' + (data.user.display_name || data.user.username) + ' (' + data.user.role + ')</small>';
      // 立即跳转（cookie 已设好，无需等待）
      window.location.href = BASE + '/v3';
    } else if (data.status === 'needs_2fa') {
      // 用户启用了微软 Authenticator：弹窗到本系统域页面完成二次验证（第一方 Cookie 上下文）
      pendingUsername = data.username || username;
      openTotpWindow(pendingUsername);
      result.className = 'result ok';
      result.innerHTML = '已弹出二次验证窗口，请在该窗口输入微软 Authenticator 验证码。<br><small>用户: ' + pendingUsername + '</small>';
    } else {
      result.className = 'result err';
      result.textContent = data.detail || data.message || '登录失败';
    }
  } catch (e) {
    result.className = 'result err';
    result.textContent = '网络错误: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '登 录';
  }
}

// 弹出本系统域的独立二次验证窗口（第一方上下文，确保会话 Cookie 能正常写入）
let totpWindow = null;
function openTotpWindow(username) {
  const url = BASE + '/static/totp-login.html?username=' + encodeURIComponent(username);
  totpWindow = window.open(url, 'lobster_mu_2fa', 'width=440,height=600');
  if (!totpWindow) {
    const result = document.getElementById('result');
    result.className = 'result err';
    result.textContent = '弹出窗口被浏览器拦截，请允许本站弹窗后重试';
  }
}

// 监听二次验证窗口通过 postMessage 回传的结果
window.addEventListener('message', function (event) {
  // 仅接受本系统域来源的消息
  if (event.origin !== BASE) return;
  const data = event.data || {};
  if (!data.source || data.source !== 'lobster_mu_2fa') return;
  const result = document.getElementById('result');
  if (data.type === '2fa_success') {
    result.className = 'result ok';
    result.innerHTML = '二次验证通过！正在进入工作台...';
    // 会话 Cookie 已在弹窗（本系统域）写入，跳转工作台
    setTimeout(function () { window.location.href = BASE + '/v3'; }, 500);
  } else if (data.type === '2fa_failed') {
    result.className = 'result err';
    result.textContent = '二次验证失败：' + (data.detail || '验证码错误');
  }
});

// 回车提交
document.getElementById('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('displayName').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('loginToken').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
