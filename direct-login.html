<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快速登录 - 多用户工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 40px;
    width: 420px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
  }
  h1 {
    color: #f1f5f9;
    font-size: 20px;
    margin-bottom: 8px;
  }
  .sub {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: #3b82f6;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #2563eb; }
  .btn:disabled { background: #475569; cursor: not-allowed; }
  .result {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .result.ok {
    display: block;
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.3);
    color: #34d399;
  }
  .result.err {
    display: block;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <h1>快速登录</h1>
  <p class="sub">输入用户名，自动创建/登录并跳转至工作台</p>

  <label>用户名</label>
  <input type="text" id="username" placeholder="例如: 3888" autocomplete="off">

  <label>显示名</label>
  <input type="text" id="displayName" placeholder="例如: 罗俊易" autocomplete="off">

  <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
  <div class="result" id="result"></div>
</div>

<script>
// 目标地址：同源时自动取当前域名，file:// 打开时需手动填写
const BASE = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
  ? window.location.origin
  : "https://claw.jbysoft.com";

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const displayName = document.getElementById('displayName').value.trim();
  const btn = document.getElementById('loginBtn');
  const result = document.getElementById('result');

  if (!username) {
    result.className = 'result err';
    result.textContent = '请输入用户名';
    return;
  }
  if (!displayName) {
    result.className = 'result err';
    result.textContent = '请输入显示名';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>登录中...';
  result.className = 'result';
  result.textContent = '';

  try {
    const res = await fetch(BASE + '/api/lobster-mu/login/direct', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, display_name: displayName })
    });

    const data = await res.json();

    if (data.status === 'success') {
      result.className = 'result ok';
      result.innerHTML = '登录成功！即将跳转...<br><small>用户: ' + (data.user.display_name || data.user.username) + ' (' + data.user.role + ')</small>';
      // 立即跳转（cookie 已设好，无需等待）
      window.location.href = BASE + '/v3';
    } else {
      result.className = 'result err';
      result.textContent = data.detail || data.message || '登录失败';
    }
  } catch (e) {
    result.className = 'result err';
    result.textContent = '网络错误: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '登 录';
  }
}

// 回车提交
document.getElementById('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('displayName').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
