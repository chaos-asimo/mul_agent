<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>龙虾Claw 多用户版</title>
    <script>
      // 首屏前应用主题，避免刷新闪烁
      try {
        var theme = 'dark'
        var raw = localStorage.getItem('v3_theme')
        if (raw) {
          var m = raw.match(/"theme":"(dark|deepblue|light|auto)"/)
          if (m) theme = m[1]
        }
        var resolved =
          theme === 'auto'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : theme
        document.documentElement.classList.add('theme-' + resolved)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
