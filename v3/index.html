<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%9E%3C/text%3E%3C/svg%3E" />
    <title>龙虾Claw 多用户版</title>
    <script>
      // 首屏前应用主题，避免刷新闪烁
      try {
        var theme = 'dark'
        var raw = localStorage.getItem('v3_theme')
        if (raw) {
          var m = raw.match(/"theme":"(dark|deepblue|light|auto)"/)
          if (m) theme = m[1]
        }
        var resolved =
          theme === 'auto'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : theme
        document.documentElement.classList.add('theme-' + resolved)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
